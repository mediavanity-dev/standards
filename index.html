<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standards Chord Charts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
/* Mobile first: base styles target phones; min-width queries add room for larger screens. */
:root{--bg:#EDF0F3;--panel:#fff;--ink:#16202B;--mute:#5B6776;--line:#CBD2DA;--acc:#2447D8;--onacc:#fff;--root:#D9822B;--key:#fff;--blk:#16202B;--err:#C0392B;--now:#FBE3C8;--tb:64px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E141B;--panel:#16202B;--ink:#E6EBF1;--mute:#93A0B0;--line:#2A3644;--acc:#7C9BFF;--onacc:#0E141B;--root:#F0A04B;--key:#E6EBF1;--blk:#05080C;--err:#FF8A7A;--now:#4A3218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E141B;--panel:#16202B;--ink:#E6EBF1;--mute:#93A0B0;--line:#2A3644;--acc:#7C9BFF;--onacc:#0E141B;--root:#F0A04B;--key:#E6EBF1;--blk:#05080C;--err:#FF8A7A;--now:#4A3218;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
input,select,button,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,h2:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:1200px;margin:0 auto;padding:12px 12px calc(var(--tb) + 24px + env(safe-area-inset-bottom,0px))}
aside,main{min-width:0}
h1{font-size:1.3rem;font-weight:800;margin:0 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 10px}
.tog{display:flex;width:100%;justify-content:space-between;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:48px}
#picker{display:none;margin-top:10px}
aside.open #picker{display:block}
input[type=search]{width:100%;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:48px}
.list{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;max-height:55vh;overflow:auto}
.list button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
.list button small{color:var(--mute);white-space:nowrap}
@media(hover:hover){.list button:hover{background:var(--panel)}}
.list button[aria-current=true]{background:var(--acc);color:var(--onacc)}
.list button[aria-current=true] small{color:var(--onacc);opacity:.85}
.empty{color:var(--mute);font-size:.9rem;padding:9px 10px}
.addbtn{display:block;width:100%;margin-top:10px;padding:0 12px;border:1px dashed var(--line);border-radius:8px;background:none;min-height:48px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.bar h2{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;flex:1 1 100%}
.meta{flex:1 1 100%;margin:-4px 0 0;color:var(--mute);font-size:.9rem}
label,.grp{display:flex;flex-direction:column;font-size:.8rem;color:var(--mute);gap:4px}
select{padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-height:44px}
.acts{display:flex;gap:8px}
.acts button,.row button{padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px}
.opts{flex:1 1 100%}
.opts summary{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;list-style:none;font-size:.95rem}
.opts summary::-webkit-details-marker{display:none}
.opts summary::after{content:"▾";color:var(--mute)}
.opts[open] summary::after{content:"▴"}
.optrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.optrow .grp{flex:1 1 100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);color:var(--ink);padding:0 12px;min-height:44px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.jumps{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:0 12px 2px;scrollbar-width:none}
.jumps::-webkit-scrollbar{display:none}
.jumps button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 16px;min-height:40px;font-size:.9rem}
.pal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -12px 14px;padding:2px 12px 6px}
.pal button{flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:68px}
.pal button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.pal svg{width:60px;height:auto}
.pal svg.pn{width:104px}
.sym b{font-weight:800}
.sym sup{font-weight:600}
.pal .sym b{font-size:1.05rem}
.pal .sym sup{font-size:.7rem}
.sec{margin-bottom:20px;scroll-margin-top:12px}
.sec h3{margin:0 0 6px;font-size:1rem}
.sec h3 span{color:var(--mute);font-weight:400;margin-left:6px;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.bars .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.cell{position:relative;display:flex;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);min-height:58px}
.cell.now{background:var(--now)}
.bn{position:absolute;top:3px;left:4px;font-size:.6rem;line-height:1;color:var(--mute);pointer-events:none;display:none}
.grid>.cell:nth-child(4n+1)>.bn{display:block}
.bars .grid>.cell:nth-child(2n+1)>.bn{display:block}
.ch{flex:1 1 0;min-width:0;position:relative;background:none;border:0;padding:14px 2px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;text-align:center}
.sym b,.sym sup{white-space:nowrap}
.ch+.ch{border-left:1px dashed var(--line)}
@media(hover:hover){.ch:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}}
.ch[aria-pressed=true]{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.ch .sym b{font-size:1.1rem}
.ch .sym sup{font-size:.72rem}
/* Bars with several chords stack each quality under its root so four bars still fit across a phone. */
.cell.multi .ch .sym{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.cell.multi .ch .sym sup{vertical-align:baseline;font-size:.66rem}
.cell.dense{grid-column:span 2}
.cell.dense .ch .sym b{font-size:.88rem}
.cell.dense .ch .sym sup{font-size:.58rem}
.cell.multi .rn{font-size:.6rem}
.cell.dense .rn{font-size:.52rem}
.ch.rep b{font-size:1.3rem;color:var(--mute);font-weight:600}
.rn{font-size:.7rem;font-weight:600;color:var(--mute)}
.ch svg{width:100%;max-width:84px;height:auto}
.ch svg.pn{max-width:120px}
.iv-s::after,.iv-e::after{content:"";position:absolute;bottom:3px;height:6px;border:2px solid var(--root);border-top:0;pointer-events:none}
.iv-s::after{left:14%;right:0;border-right:0;border-radius:0 0 0 6px}
.iv-e::after{left:0;right:14%;border-left:0;border-radius:0 0 6px 0}
.ends{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.end{flex:1 1 100%;min-width:0}
.end .lbl{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 8px;border-top:2px solid var(--ink);border-left:2px solid var(--ink);margin-bottom:4px}
.s{stroke:var(--ink);stroke-width:.8;fill:none}
.t{fill:var(--ink)}
.detail{position:fixed;left:0;right:0;bottom:calc(var(--tb) + env(safe-area-inset-bottom,0px));z-index:20;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;max-height:52vh;overflow:auto;padding:14px 14px 16px;box-shadow:0 -8px 30px rgba(0,0,0,.25);display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:center}
main.hassel{padding-bottom:50vh}
.detail .dt{flex:1 1 100%;order:-1;padding-right:48px}
.detail .nm{font-size:2rem;font-weight:800;line-height:1}
.detail .nm sup{font-size:1.1rem;font-weight:600}
.detail p{margin:6px 0 0;color:var(--mute);font-size:.9rem}
.notes small{color:var(--mute);font-size:.68rem;margin-left:2px}
.dg svg{width:110px;height:auto}
.dp svg{width:min(78vw,340px);height:auto}
.alts{flex:1 1 100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.alts button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 6px;min-width:64px}
.alts button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.alts svg{width:48px;height:auto}
.alts small{font-size:.65rem;color:var(--mute);white-space:nowrap}
.hint{flex:1 1 100%}
.x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:22px;background:var(--bg);font-size:1.1rem}
.transport{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));min-height:var(--tb)}
.pbtn{flex:0 0 auto;min-width:104px;min-height:48px;border:0;border-radius:999px;background:var(--acc);color:var(--onacc);font-weight:600;padding:0 18px}
.tempo{flex:1;min-width:0;flex-direction:row;align-items:center;gap:10px;font-size:.85rem;max-width:420px}
@media(max-width:420px){.transport{gap:10px;padding-left:12px;padding-right:12px}.pbtn{min-width:92px}.tempo>span{display:none}}
.tempo input{flex:1;min-width:0;accent-color:var(--acc);height:44px;margin:0}
.tempo output{min-width:4.6em;color:var(--ink);font-variant-numeric:tabular-nums}
.ttag{flex:0 0 auto;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);white-space:nowrap}
.foot{color:var(--mute);font-size:.8rem;margin-top:24px;max-width:70ch}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(520px,calc(100% - 24px));padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{margin-bottom:12px}
dialog input,dialog textarea{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-height:44px}
dialog textarea{min-height:160px;font-family:ui-monospace,monospace}
.row{display:flex;gap:8px;justify-content:flex-end}
.row .go{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.err{color:var(--err);font-size:.85rem;min-height:1.2em}
@media(min-width:600px){
.app{padding-left:16px;padding-right:16px}
.ch .sym b{font-size:1.3rem}
.ch .sym sup{font-size:.8rem}
.cell.multi .ch .sym b{font-size:1.15rem}
.cell.multi .ch .sym sup{font-size:.72rem}
.clean .cell.dense{grid-column:auto}
.cell.dense .ch .sym b{font-size:1rem}
.cell.dense .ch .sym sup{font-size:.64rem}
.optrow .grp{flex:0 1 auto}
.jumps,.pal{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
}
@media(min-width:700px){
.cell.dense{grid-column:auto}
.bars .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.bars .grid>.cell:nth-child(2n+1)>.bn{display:none}
.bars .grid>.cell:nth-child(4n+1)>.bn{display:block}
}
@media(min-width:760px){
.end{flex:1 1 0}
.end .grid,.bars .end .grid{grid-template-columns:repeat(var(--c),minmax(0,1fr))}
.cell.multi:not(.dense) .ch .sym{display:block}
.cell.multi:not(.dense) .ch .sym sup{vertical-align:super}
}
@media(min-width:900px){
.app{grid-template-columns:260px minmax(0,1fr);gap:28px;padding:20px 20px calc(var(--tb) + 24px)}
aside{position:sticky;top:12px;align-self:start;max-height:calc(100vh - var(--tb) - 24px);overflow:auto}
.tog{display:none}
#picker{display:block;margin-top:0}
h1{font-size:1.6rem}
.list{max-height:none}
.bar h2{font-size:2rem}
.jumps,.pal{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
.detail{position:sticky;top:8px;bottom:auto;z-index:5;border:1px solid var(--line);border-radius:12px;max-height:none;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-bottom:16px;justify-content:flex-start;padding:16px 60px 16px 16px}
.detail .dt{flex:1 1 220px;order:0;padding-right:0}
main.hassel{padding-bottom:0}
}
@media print{
aside,.opts,.acts,.x,.detail,.transport,.jumps,.pal{display:none!important}
.app{display:block;padding:0}
body{background:#fff;color:#000}
.cell,.grid{border-color:#999}
.cell.now{background:none}
.sec{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
<aside>
<h1>Standards chord charts</h1>
<p class="sub"><span id="cnt"></span> tunes. Pick one, then tap any chord for a closer look.</p>
<button id="tog" class="tog" aria-expanded="false">Choose a song</button>
<div id="picker"><input type="search" id="q" placeholder="Search songs, “blues”, “rhythm”" aria-label="Search songs"><ul class="list" id="list"></ul>
<button id="add" class="addbtn">Add your own song</button></div>
</aside>
<main id="main"></main>
</div>
<div class="transport" id="transport" role="region" aria-label="Playback"><button id="play" class="pbtn" aria-pressed="false">▶ Play</button>
<label class="tempo"><span>Tempo</span><input type="range" id="tempo" min="40" max="280" step="4" aria-label="Tempo in beats per minute"><output id="bpm" for="tempo"></output></label><span class="ttag" id="ttag" hidden></span></div>
<dialog id="dlg"><form id="frm" method="dialog"><h2 id="dt" style="margin:0 0 12px">Add your own song</h2>
<label>Title<input id="nt" type="text"></label>
<label>Key, such as Bb or Gm<input id="nk" type="text"></label>
<label>Chords: one section per line, bars separated by |, chords within a bar by spaces. A name before a colon is optional. Slash chords like Bb/D work. Add a dot after a chord to hold it another beat, as in Cm7 F7 Bbmaj7 .<textarea id="nb" placeholder="A: Dm7 G7 | Cmaj7 | Am7 D7 | Gm7 C7&#10;B: Fmaj7 | Bb7 | Em7b5 A7 | Dm7"></textarea></label>
<div class="err" id="ne" role="alert"></div>
<div class="row"><button type="button" id="nc">Cancel</button><button id="ns" class="go">Add song</button></div></form></dialog>
<script>
const FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'],SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const LP={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const adj=a=>a==="#"?1:a==="b"?-1:0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okChord=ch=>/^[A-G][b#]?(?:[A-Za-z0-9#+()\-]|\/9)*(\/[A-G][b#]?)?$/.test(ch);
// A bar is chords separated by spaces; a "." holds the previous chord one more beat.
const okBar=b=>{const t=b.trim().split(/\s+/);return t[0]!=="."&&t.every(x=>x==="."||okChord(x))};
const keyInfo=k=>{const m=String(k).match(/^([A-G])([b#]?)(m?)$/);return m&&{tonic:(LP[m[1]]+adj(m[2])+12)%12,minor:m[3]?1:0}};
// Shared forms. Rhythm changes in Bb, and 12-bar blues heads.
const RCA="Bbmaj7 G7|Cm7 F7|Dm7 G7|Cm7 F7|Fm7 Bb7|Ebmaj7 Edim7|Bbmaj7 G7|Cm7 F7",RCB="D7|D7|G7|G7|C7|C7|F7|F7",
RCL="Bbmaj7 G7|Cm7 F7|Dm7 G7|Cm7 F7|Fm7 Bb7|Ebmaj7 Edim7|Bbmaj7 F7|Bb6";
const rc=(t,o)=>({t,key:"Bb",note:"Rhythm changes",sec:[{n:"A",x:2,b:RCA},{n:"B",b:RCB},{n:"Last A",b:RCL}],...o});
const BBJ="Bb7|Eb7|Bb7|Fm7 Bb7|Eb7|Edim7|Bb7 G7b9|Cm7 F7|Dm7 G7|Cm7 F7|Bb7 G7|Cm7 F7";
const blues=(t,key,b,note)=>({t,key,note:note||"12-bar blues",sec:[{n:"Blues",b}]});
// Common changes as typically played. Bars split by "|", chords in a bar by spaces; "." holds a chord one more beat.
// m is beats per bar when it isn't 4. Edit or add songs here.
const SONGS=[
{t:"All the Things You Are",key:"Ab",sec:[
{n:"A",b:"Fm7|Bbm7|Eb7|Abmaj7|Dbmaj7|Dm7 G7|Cmaj7|Cmaj7"},
{n:"A",b:"Cm7|Fm7|Bb7|Ebmaj7|Abmaj7|Am7 D7|Gmaj7|Gmaj7"},
{n:"B",b:"Am7|D7|Gmaj7|Gmaj7|F#m7|B7|Emaj7|C7#5"},
{n:"A",b:"Fm7|Bbm7|Eb7|Abmaj7|Dbmaj7|Dbm7|Cm7|Bdim7|Bbm7|Eb7|Abmaj7|Gm7b5 C7b9"}]},
{t:"Autumn Leaves",key:"Gm",sec:[
{n:"A",x:2,b:"Cm7|F7|Bbmaj7|Ebmaj7|Am7b5|D7b9|Gm7|Gm7"},
{n:"B",b:"Am7b5|D7b9|Gm7|Gm7|Cm7|F7|Bbmaj7|Ebmaj7"},
{n:"C",b:"Am7b5|D7b9|Gm7 Gb7|Fm7 E7|Ebmaj7|Am7b5 D7b9|Gm6|Gm6"}]},
{t:"Blue Bossa",key:"Cm",sec:[
{n:"Form",b:"Cm7|Cm7|Fm7|Fm7|Dm7b5|G7b9|Cm7|Cm7|Ebm7|Ab7|Dbmaj7|Dbmaj7|Dm7b5|G7b9|Cm7|Dm7b5 G7b9"}]},
blues("Blues for Alice","F","Fmaj7|Em7b5 A7b9|Dm7 G7|Cm7 F7|Bb7|Bbm7 Eb7|Am7 D7b9|Abm7 Db7|Gm7|C7|Fmaj7 D7b9|Gm7 C7","Bird blues"),
blues("Bb Jazz Blues","Bb",BBJ),
{t:"Fly Me to the Moon",key:"Am",sec:[
{n:"A",b:"Am7|Dm7|G7|Cmaj7 C7|Fmaj7|Bm7b5|E7|Am7 A7"},
{n:"B",b:"Dm7|G7|Cmaj7|Am7|Dm7|G7|Cmaj7|Bm7b5 E7"},
{n:"A",b:"Am7|Dm7|G7|Cmaj7 C7|Fmaj7|Bm7b5|E7|Am7 A7"},
{n:"C",b:"Dm7|G7|Cmaj7|Am7|Dm7|G7|C6|Bm7b5 E7"}]},
{t:"The Girl from Ipanema",key:"F",sec:[
{n:"A",x:2,b:"Fmaj7|Fmaj7|G7|G7|Gm7|Gb7|Fmaj7|Gb7"},
{n:"B",b:"Gbmaj7|Gbmaj7|B7|B7|F#m7|F#m7|D7|D7|Gm7|Gm7|Eb7|Eb7|Am7|D7b9|Gm7|C7b9"},
{n:"Last A",b:"Fmaj7|Fmaj7|G7|G7|Gm7|Gb7|Fmaj7|Fmaj7"}]},
{t:"Misty",key:"Eb",sec:[
{n:"A",b:"Ebmaj7|Bbm7 Eb7|Abmaj7|Abm7 Db7|Ebmaj7 Cm7|Fm7 Bb7|Gm7 C7|Fm7 Bb7"},
{n:"A",b:"Ebmaj7|Bbm7 Eb7|Abmaj7|Abm7 Db7|Ebmaj7 Cm7|Fm7 Bb7|Eb6|Eb6"},
{n:"B",b:"Bbm7|Eb7b9|Abmaj7|Abmaj7|Am7|D7 F7|Gm7b5 C7b9|Fm7 Bb7"},
{n:"A",b:"Ebmaj7|Bbm7 Eb7|Abmaj7|Abm7 Db7|Ebmaj7 Cm7|Fm7 Bb7|Eb6|Fm7 Bb7"}]},
{t:"Satin Doll",key:"C",sec:[
{n:"A",b:"Dm7 G7|Dm7 G7|Em7 A7|Em7 A7|Am7 D7|Abm7 Db7|C|Em7b5 A7b9"},

let SEQ=[];
function render(){const sg=SONGS[S.i],beats=sg.m||4,tonic=(sg.tonic+S.shift)%12,nm=names(tonic,sg.minor);
const a=document.activeElement;let fk=null;
if(a&&$("main").contains(a)){for(const k of["n","pn","i","v","a","g","j"])if(a.dataset[k]!==undefined){fk=`[data-${k}="${a.dataset[k]}"]`;break}
if(!fk&&a.id)fk="#"+a.id}
const cache=new Map(),sym=ch=>{if(cache.has(ch))return cache.get(ch);const p=parse(ch),pc=(p.pc+S.shift)%12;
const root=S.shift===0?ch.match(/^[A-G][b#]?/)[0]:nm[pc];
const bass=p.bass?{pc:(p.bass.pc+S.shift)%12,n:S.shift===0?p.bass.n:nm[(p.bass.pc+S.shift)%12]}:null;
const suf=p.q+(bass?"/"+bass.n:""),c={...p,pc,bass,root,suf,full:root+suf};c.sp=spell(root,c);cache.set(ch,c);return c};
const blocks=layout(sg),toks=[];let n=0,id=0,num=1;
const mk=(b,k)=>({id:id++,num:k,toks:parseBar(b,beats).map(t=>{const o={...t,n:n++,c:sym(t.ch)};toks.push(o);return o})});
for(const B of blocks){B.sh=B.shared.map(b=>mk(b,num++));if(B.ends){const s=num;B.e=B.ends.map(e=>e.map((b,j)=>mk(b,s+j)));num=s+B.ends[0].length}}
// Playing order: repeats and endings written out. Voicings follow this order; a chord written once keeps its first voicing.
const play=[];for(const B of blocks){if(B.e)play.push(...B.sh,...B.e[0],...B.sh,...B.e[1]);else for(let r=0;r<B.x;r++)play.push(...B.sh)}
const pt=play.flatMap(b=>b.toks);
const gc=pt.map(t=>{const all=gCands(t.c),p=S.pref[t.ch],f=p?all.filter(fr=>fr.join()===p):[];return f.length?f:all});
const gi=lead(gc,gNode,gStep),pc=pt.map(t=>pCands(t.c)),pi=lead(pc,pNode,pStep);
pt.forEach((t,k)=>{if(!t.g){t.g=gc[k][gi[k]];t.p=pc[k][pi[k]]}});
const iv=new Map();pt.forEach((t,k)=>{const u=pt[k+1];if(u&&MINOR.test(t.c.ty)&&DOM.test(u.c.ty)&&(u.c.pc-t.c.pc+12)%12===5){iv.set(t.n,"iv-s");iv.set(u.n,"iv-e")}});
SEQ=play.flatMap(b=>{const tot=b.toks.reduce((s,t)=>s+t.slots,0);return b.toks.map(t=>({bar:b.id,dur:beats*t.slots/tot,v:t.p}))});
const total=sg.sec.reduce((s,x)=>s+x.b.split("|").length*(x.x||1),0);
const letters=sg.sec.map(x=>(x.n.match(/^(?:Last |First )?([A-E])(?=$|[\s’'(])/)||[])[1]);
const form=(sg.sec.length>1&&letters.every(Boolean)?sg.sec.map((x,k)=>letters[k].repeat(x.x||1)).join("")+" · ":"")+total+" bars"+(beats!==4?` in ${beats}/4`:"");
const keyOpts=[...Array(12)].map((_,k)=>{const t=(sg.tonic+k)%12;return`<option value="${k}"${k===S.shift?" selected":""}>${names(t,sg.minor)[t]}${sg.minor?"m":""}${k===0?" (common)":""}</option>`}).join("");
const seg=(k,opts,cur)=>opts.map(([v,l])=>`<button data-${k}="${v}" aria-pressed="${cur===v}">${l}</button>`).join("");
const dia=t=>S.inst==="none"?"":(S.inst!=="piano"?gSVG(t.g):"")+(S.inst!=="guitar"?pSVG(t.p,t.c):"");
const symH=c=>`<span class="sym"><b>${esc(c.root)}</b><sup>${esc(c.suf)}</sup></span>`;
let h=`<div class="bar"><h2 tabindex="-1" id="ttl">${esc(sg.t)}</h2><p class="meta">${esc([form,sg.note,sg.custom&&"Your song"].filter(Boolean).join(" · "))}</p>
<label>Key<select id="key">${keyOpts}</select></label>
${sg.custom?`<div class="acts"><button id="editS">Edit</button><button id="delS">Delete</button></div>`:""}
<details class="opts" id="opts"${S.opts?" open":""}><summary>View options</summary><div class="optrow">
<div class="grp"><span id="dl">Diagrams</span><span class="seg" role="group" aria-labelledby="dl">${seg("i",[["guitar","Guitar"],["piano","Piano"],["both","Both"],["none","Off"]],S.inst)}</span></div>
<div class="grp"><span id="vl">Chart</span><span class="seg" role="group" aria-labelledby="vl">${seg("v",[["clean","Clean"],["bars","Diagrams in bars"]],S.view)}</span></div>
<div class="grp"><span id="al">Analysis</span><span class="seg" role="group" aria-labelledby="al"><button data-a="iiv" aria-pressed="${S.iiv}">ii–V brackets</button><button data-a="rn" aria-pressed="${S.rn}">Numerals</button></span></div>
<label>Playback tuning<select id="tune">${[...Array(13)].map((_,j)=>{const k=j-6;return`<option value="${k}"${k===S.tune?" selected":""}>${k?`${signed(k)} semitone${Math.abs(k)>1?"s":""}${TUNINGS[k]?` (${TUNINGS[k]})`:""}`:"Standard"}</option>`}).join("")}</select></label>
</div></details></div>`;
const sel=S.selN!==null?toks[S.selN]:null;
if(sel){const t=sel,c=t.c,alts=gCands(c),used=t.g.join();
const gp=new Set(t.g.map((x,i)=>x===null?-1:(OPEN[i]+x)%12)),miss=c.sp.filter(x=>x.d!=="1"&&x.d!=="5"&&!gp.has(x.pc)).map(x=>x.d);
h+=`<div class="detail" role="region" aria-label="Chord detail"><button class="x" id="closeD" aria-label="Close chord detail">✕</button>
<div class="dt"><div class="nm">${esc(c.root)}<sup>${esc(c.suf)}</sup></div>
<p class="notes">Notes: ${c.sp.map(x=>`${x.name}<small>${x.d}</small>`).join(" · ")}${c.bass?` · bass ${esc(c.bass.n)}`:""}</p>
${c.exact?"":`<p>Voiced from the nearest common chord (${degs(c.ty).join(" ")}); the written chord adds more.</p>`}
${miss.length?`<p>This guitar voicing leaves out the ${miss.join(", ")}.</p>`:""}
${c.noBass?`<p>No close guitar shape puts ${esc(c.bass.n)} in the bass, so the guitar plays the chord without it.</p>`:""}
<p>Orange is the bass note. The piano plays it with the left hand and the rest with the right. Voicings are chosen to move smoothly from the chord before.</p></div>
<div class="dg">${gSVG(t.g)}</div><div class="dp">${pSVG(t.p,c)}</div>
${alts.length>1?`<div class="alts" role="group" aria-label="Guitar voicings">${alts.map(fr=>{const k=fr.join();
return`<button data-g="${k}" aria-pressed="${k===used}" aria-label="${esc(`${ORD[lowStr(fr)]} string root, fret ${minFret(fr)}`)}">${gSVG(fr)}<small>${ORD[lowStr(fr)]} str · fr ${minFret(fr)}</small></button>`}).join("")}</div>
<p class="hint">Tap a voicing to use it for every ${esc(c.full)} in this tune${S.pref[t.ch]?"; tap it again to go back to automatic":""}.</p>`:""}</div>`}
if(S.view==="clean"&&S.inst!=="none"){const seen=new Set(),pal=toks.filter(t=>!seen.has(t.c.full)&&seen.add(t.c.full));
h+=`<div class="pal" role="group" aria-label="Chords in this tune">${pal.map(t=>`<button data-pn="${t.n}" data-c="${esc(t.ch)}" aria-pressed="${S.selC===t.ch}" aria-label="${esc(t.c.full)}">${symH(t.c)}${dia(t)}</button>`).join("")}</div>`}
if(blocks.length>1)h+=`<nav class="jumps" aria-label="Sections">${blocks.map((B,k)=>`<button data-j="${k}">${esc(B.n)}</button>`).join("")}</nav>`;
const tokH=(t,rep)=>{const c=t.c,cls=[S.iiv&&iv.get(t.n),rep&&"rep"].filter(Boolean).join(" ");
return`<button class="ch${cls?" "+cls:""}" style="flex-grow:${t.slots}" data-n="${t.n}" data-c="${esc(t.ch)}" aria-pressed="${S.selC===t.ch}" aria-label="${esc(rep?"Repeat previous bar, "+c.full:c.full)}">${rep?"<b>%</b>":symH(c)}${S.rn&&!rep?`<span class="rn">${esc(roman(c,tonic))}</span>`:""}${S.view==="bars"&&!rep?dia(t):""}</button>`};
// A bar identical to the one before is written as a repeat sign, as on a printed chart.
const grid=(bars,cols)=>{let prev=null;return`<div class="grid"${cols?` style="--c:${cols};--c2:${Math.min(cols,2)}"`:""}>${bars.map(b=>{
const key=b.toks.map(t=>t.ch+"."+t.slots).join(" "),rep=key===prev;prev=key;
return`<div class="cell${b.toks.length>1&&!rep?" multi":""}${b.toks.length>2&&!rep?" dense":""}${PB.cur===b.id?" now":""}" data-bar="${b.id}"><span class="bn">${b.num}</span>${rep?tokH(b.toks[0],true):b.toks.map(t=>tokH(t,false)).join("")}</div>`}).join("")}</div>`};
h+=`<div class="chart ${S.view}">`;
blocks.forEach((B,k)=>{const info=B.e?`${B.shared.length+B.ends[0].length} bars · ×2 with endings`:`${B.shared.length} bars${B.x>1?` · play ×${B.x}`:""}`;
h+=`<section class="sec" id="sec${k}"><h3>${esc(B.n)}<span>${info}</span></h3>${grid(B.sh)}${B.e?`<div class="ends">${B.e.map((e,j)=>`<div class="end"><span class="lbl">${j+1}.</span>${grid(e,Math.min(e.length,4))}</div>`).join("")}</div>`:""}</section>`});
h+=`</div><p class="foot">Chords are the commonly played changes for each standard, in the key most often used. Many were checked against a standard fake book; charts vary between books and players, so check them against your favorite recording. Use “Add your own song” to build out your library; custom songs are saved on this device.</p>`;
$("main").innerHTML=h;
$("main").classList.toggle("hassel",!!sel);
savePrefs();
if(fk){const el=$("main").querySelector(fk);if(el)el.focus({preventScroll:true})}}
// Playback: piano voicings through Web Audio, scheduled slightly ahead of time so timing stays steady.
let AC=null,OUT=null;const PB={on:false,i:0,t:0,timer:0,cur:null,tm:[]};
function setPlayUI(){$("play").textContent=PB.on?"■ Stop":"▶ Play";$("play").setAttribute("aria-pressed",PB.on)}
function tone(m,t,d,g,type){const o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.value=440*2**((m+S.tune-69)/12);
a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+.015);a.gain.setTargetAtTime(g*.25,t+.02,.35);a.gain.setTargetAtTime(0,t+Math.max(.05,d-.06),.04);
o.connect(a);a.connect(OUT);o.start(t);o.stop(t+d+.3)}
function sound(v,t,d){tone(v.lh-12,t,d,.3,"sine");tone(v.lh,t,d,.05,"triangle");v.rh.forEach(m=>tone(m,t,d*.92,.065,"triangle"))}
function mark(bar){if(!PB.on)return;PB.cur=bar;document.querySelectorAll(".cell.now").forEach(x=>x.classList.remove("now"));
const el=document.querySelector(`.cell[data-bar="${bar}"]`);if(!el)return;el.classList.add("now");
const r=el.getBoundingClientRect(),d=document.querySelector(".detail"),wide=matchMedia("(min-width:900px)").matches;
const top=wide&&d?d.getBoundingClientRect().bottom:0,bottom=!wide&&d?d.getBoundingClientRect().top:$("transport").getBoundingClientRect().top;
if(r.top<top+4||r.bottom>bottom-4)scrollBy({top:r.top-(top+(bottom-top-r.height)/2),behavior:"smooth"})}
function tick(){const spb=60/S.bpm;while(PB.t<AC.currentTime+.15){const ev=SEQ[PB.i%SEQ.length],d=ev.dur*spb,at=PB.t;sound(ev.v,at,d);
PB.tm.push(setTimeout(()=>mark(ev.bar),Math.max(0,(at-AC.currentTime)*1000)));PB.t+=d;PB.i++}
PB.tm=PB.tm.slice(-64)}
function start(){if(!SEQ.length)return;if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();
OUT=AC.createGain();OUT.gain.value=.55;const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2800;OUT.connect(lp);lp.connect(AC.destination)}
AC.resume();PB.on=true;PB.i=0;PB.t=AC.currentTime+.1;tick();PB.timer=setInterval(tick,25);setPlayUI()}
function stop(){PB.on=false;clearInterval(PB.timer);PB.tm.forEach(clearTimeout);PB.tm=[];PB.cur=null;
document.querySelectorAll(".cell.now").forEach(x=>x.classList.remove("now"));setPlayUI()}
$("play").onclick=()=>PB.on?stop():start();
$("tempo").value=S.bpm;$("bpm").textContent=S.bpm+" bpm";
function setTuneUI(){const t=$("ttag");t.hidden=!S.tune;t.textContent=signed(S.tune);t.title=S.tune?`Playing ${Math.abs(S.tune)} semitone${Math.abs(S.tune)>1?"s":""} ${S.tune<0?"down":"up"}`:""}
setTuneUI();
$("tempo").oninput=e=>{S.bpm=+e.target.value;$("bpm").textContent=S.bpm+" bpm";savePrefs()};
// One set of delegated handlers on #main, so re-rendering never strands focus.
let lastSel=null;
function closeDetail(){S.selN=S.selC=null;render();const el=lastSel&&$("main").querySelector(lastSel);if(el)el.focus({preventScroll:true})}
$("main").addEventListener("click",e=>{const t=e.target.closest("button,select");if(!t)return;
if(t.id==="closeD")return closeDetail();
if(t.id==="editS")return openDlg(S.i);
if(t.id==="delS"){if(confirm("Delete “"+SONGS[S.i].t+"” from this device?")){SONGS.splice(S.i,1);saveCustom();pick(order()[0].i)}return}
if(t.dataset.i){S.inst=t.dataset.i;render();return}
if(t.dataset.v){S.view=t.dataset.v;render();return}
if(t.dataset.a){S[t.dataset.a]=!S[t.dataset.a];render();return}
if(t.dataset.j!==undefined){$("sec"+t.dataset.j).scrollIntoView({behavior:"smooth",block:"start"});return}
if(t.dataset.g){const k=S.selC;if(S.pref[k]===t.dataset.g)delete S.pref[k];else S.pref[k]=t.dataset.g;render();return}
const nn=t.dataset.n!==undefined?t.dataset.n:t.dataset.pn;if(nn===undefined)return;
const y=t.getBoundingClientRect().top,q=t.dataset.pn!==undefined?`[data-pn="${nn}"]`:`[data-n="${nn}"]`;lastSel=q;
if(S.selN===+nn)S.selN=S.selC=null;else{S.selN=+nn;S.selC=t.dataset.c}
render();
// Keep the tapped chord where it was, and clear of the detail panel (sticky on wide screens, a bottom sheet on phones).
const el=$("main").querySelector(q),d=document.querySelector(".detail");if(!el)return;
scrollBy(0,el.getBoundingClientRect().top-y);if(!d)return;const r=el.getBoundingClientRect(),dr=d.getBoundingClientRect();
if(matchMedia("(min-width:900px)").matches){if(r.top<dr.bottom+8)scrollBy(0,r.top-dr.bottom-8)}else if(r.bottom>dr.top-8)scrollBy(0,r.bottom-dr.top+8)});
$("main").addEventListener("change",e=>{if(e.target.id==="key"){S.shift=+e.target.value;S.pref={};render()}
if(e.target.id==="tune"){S.tune=+e.target.value;setTuneUI();savePrefs()}});
$("main").addEventListener("toggle",e=>{if(e.target.id==="opts"){S.opts=e.target.open;savePrefs()}},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.selN!==null&&!$("dlg").open)closeDetail();
if(e.key===" "&&e.target===document.body){e.preventDefault();PB.on?stop():start()}});
function renderList(){const rows=order().filter(({s})=>(s.t+" "+(s.note||"")).toLowerCase().includes(S.q));
$("cnt").textContent=SONGS.length;
$("list").innerHTML=rows.length?rows.map(({s,i})=>
`<li><button data-s="${i}" aria-current="${i===S.i}">${esc(s.t)}<small>${s.custom?"yours · ":""}${esc(s.key)}</small></button></li>`).join(""):`<li class="empty">No matching songs.</li>`}
function pick(i){if(PB.on)stop();S.i=i;S.shift=0;S.selN=S.selC=null;S.pref={};renderList();render()}
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;
pick(+b.dataset.s);
document.querySelector("aside").classList.remove("open");$("tog").setAttribute("aria-expanded","false");scrollTo(0,0);$("ttl").focus({preventScroll:true})});
$("q").oninput=e=>{S.q=e.target.value.toLowerCase();renderList()};
$("tog").onclick=()=>{const o=document.querySelector("aside").classList.toggle("open");$("tog").setAttribute("aria-expanded",o)};
// Add and edit share one dialog; ed is the index being edited, or null when adding.
let ed=null;
function openDlg(i){ed=i;const s=i===null?null:SONGS[i];
$("dt").textContent=s?"Edit song":"Add your own song";$("ns").textContent=s?"Save changes":"Add song";
$("nt").value=s?s.t:"";$("nk").value=s?s.key:"";
$("nb").value=s?s.sec.map(x=>(x.n==="Form"?"":x.n+": ")+x.b.split("|").join(" | ")).join("\n"):"";
$("ne").textContent="";$("dlg").showModal()}
$("add").onclick=()=>openDlg(null);
$("nc").onclick=()=>$("dlg").close();
$("frm").addEventListener("submit",e=>{e.preventDefault();
const t=$("nt").value.trim(),k=$("nk").value.trim(),ki=keyInfo(k),lines=$("nb").value.split("\n").map(l=>l.trim()).filter(Boolean);
if(!t||!ki||!lines.length){$("ne").textContent="Add a title, a key like Bb or Gm, and at least one line of chords.";return}
const sec=[];
for(const l of lines){const m=l.match(/^(?:([^:|]+):)?(.*)$/);const b=m[2].trim().split("|").map(x=>x.trim()).filter(Boolean);
for(const bar of b){const tk=bar.split(/\s+/);if(tk[0]==="."){$("ne").textContent="A bar can’t start with a dot; put the chord first, as in Cm7 . F7 .";return}
for(const ch of tk)if(ch!=="."&&!okChord(ch)){$("ne").textContent="I don’t recognize that chord: "+ch.slice(0,20)+". Chords look like Dm7, G7b9, Cmaj7, C6/9 or Bb/D.";return}}
if(!b.length){$("ne").textContent="Every line needs at least one chord.";return}
sec.push({n:(m[1]||"").trim()||"Form",b:b.join("|")})}
const song={t,key:k,...ki,sec,custom:1};
if(ed===null){SONGS.push(song);ed=SONGS.length-1}else SONGS[ed]=song;
saveCustom();$("dlg").close();pick(ed)});
renderList();render();setPlayUI();
</script>
</body>
